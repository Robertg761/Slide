name: Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out the tagged commit without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || {
            echo "Pinned Android SDK manager was not found at $sdkmanager" >&2
            exit 1
          }
          "$sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" </dev/null >/dev/null

      - name: Validate immutable release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$RELEASE_TAG" =~ ^v${semver}$ ]]; then
            echo "Expected a complete SemVer tag such as v0.2.1 or v0.2.1-alpha.1; got $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          precedence="${version%%+*}"
          if [[ "$precedence" == *-* ]]; then
            prerelease_ids="${precedence#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease_ids"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not have leading zeroes: $identifier" >&2
                exit 1
              fi
            done
          fi
          gradle_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)/\1/p' app/build.gradle.kts)"
          [[ "$gradle_version" == "$version" ]] || {
            echo "Tag $RELEASE_TAG does not match app versionName $gradle_version" >&2
            exit 1
          }
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "versionCode must be a positive integer; got $version_code" >&2
            exit 1
          }
          git fetch --no-tags origin main --depth=1
          [[ "$(git rev-parse "$GITHUB_SHA")" == "$(git rev-parse FETCH_HEAD)" ]] || {
            echo "Release tag must point to the current main HEAD." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          if [[ "$precedence" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify monotonic release version history
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: bash tools/verify_version_history.sh "$VERSION" "$VERSION_CODE"

      - name: Prepare every pinned runtime asset
        run: bash tools/prepare_assets.sh

      - name: Export exact resolved release runtime artifacts
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          :app:writeReleaseRuntimeArtifacts

      - name: Test release metadata and artifact scripts
        run: bash tools/test_release_scripts.sh

      - name: Run all JVM tests and release lint
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          :core:testDebugUnitTest
          :engine:testDebugUnitTest
          :asr:testDebugUnitTest
          :ime:testDebugUnitTest
          :app:testDebugUnitTest
          :app:lintRelease

      - name: Build unsigned release twice reproducibly
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean :app:assembleRelease
          first="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$first" ]] || { echo "First release APK was not found." >&2; exit 1; }
          cp "$first" "$RUNNER_TEMP/Slide-first.apk"
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean :app:assembleRelease
          second="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$second" ]] || { echo "Second release APK was not found." >&2; exit 1; }
          cmp --silent "$RUNNER_TEMP/Slide-first.apk" "$second" || {
            sha256sum "$RUNNER_TEMP/Slide-first.apk" "$second" >&2
            echo "Two clean unsigned builds were not byte-for-byte reproducible." >&2
            exit 1
          }
          mkdir -p dist
          cp "$second" "dist/Slide-${VERSION}-unsigned.apk"
          cp app/build/outputs/mapping/release/mapping.txt \
            "dist/Slide-${VERSION}-mapping.txt"
          cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            "dist/Slide-${VERSION}-native-debug-symbols.zip"

      - name: Verify unsigned APK package, model, compression, and ABIs
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: >-
          bash tools/verify_release_apk.sh
          "dist/Slide-${VERSION}-unsigned.apk"
          "$VERSION"
          "$VERSION_CODE"
          unsigned

      - name: Extract this version's release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: bash tools/extract_release_notes.sh "$VERSION" CHANGELOG.md > dist/release-notes.md

      - name: Generate the reviewed runtime SBOM
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :app:writeReleaseRuntimeArtifacts
          python3 tools/build_sbom.py \
            "$VERSION" \
            "$GITHUB_SHA" \
            "dist/Slide-${VERSION}.cdx.json"

      - name: Include verification tooling in the approval artifact
        run: cp tools/verify_release_apk.sh dist/verify_release_apk.sh

      - name: Upload unprivileged build for approval-gated signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  instrumentation:
    name: Packaged runtime (Android ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: ["26", "37.0"]
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" </dev/null >/dev/null

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare every pinned runtime asset
        run: bash tools/prepare_assets.sh

      - name: Run packaged speech and neural swipe tests
        run: bash tools/run_android_instrumentation.sh "${{ matrix.api }}"

      - name: Upload instrumentation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-instrumentation-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            asr/build/reports/androidTests/**
            asr/build/outputs/androidTest-results/**
            engine/build/reports/androidTests/**
            engine/build/outputs/androidTest-results/**
            build/reports/instrumentation-api-*.log
          if-no-files-found: ignore
          retention-days: 7

  reproduce-source-export:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download the reference unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: reference

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" </dev/null >/dev/null

      - name: Rebuild from an independent source export
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/slide-source-export"
          mkdir -p "$export_dir"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$export_dir"
          cd "$export_dir"
          bash tools/prepare_assets.sh
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:assembleRelease
          rebuilt="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$rebuilt" ]] || { echo "Source-export APK was not found." >&2; exit 1; }
          cmp --silent "$GITHUB_WORKSPACE/reference/Slide-${VERSION}-unsigned.apk" "$rebuilt" || {
            sha256sum "$GITHUB_WORKSPACE/reference/Slide-${VERSION}-unsigned.apk" "$rebuilt" >&2
            echo "The source-export build differs from the reviewed unsigned artifact." >&2
            exit 1
          }

  sign:
    needs: [build, instrumentation, reproduce-source-export]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      apk_sha256: ${{ steps.digest.outputs.apk_sha256 }}
    steps:
      - name: Download the exact unprivileged build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: input

      - name: Install trusted Android signing tools
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || {
            echo "Pinned Android SDK manager was not found at $sdkmanager" >&2
            exit 1
          }
          "$sdkmanager" --install "build-tools;36.0.0" </dev/null >/dev/null

      - name: Sign without checking out or executing repository code
        env:
          KEYSTORE_B64: ${{ secrets.SLIDE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SLIDE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLIDE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLIDE_SIGNING_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing required release secret: $name" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/slide-release.p12"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$key_path" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/Slide-${VERSION}.apk" \
            "input/Slide-${VERSION}-unsigned.apk"
          rm -f "$key_path"
          trap - EXIT

      - name: Verify final APK after signing secrets and key are gone
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_CERT_SHA256: bdf83aa0644badcfacb76f34bffa1c6aa302bfde39769f25e117ac5d5cf5b67e
        run: >-
          bash input/verify_release_apk.sh
          "dist/Slide-${VERSION}.apk"
          "$VERSION"
          "$VERSION_CODE"
          "$RELEASE_CERT_SHA256"

      - name: Record final artifact digest
        id: digest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum "dist/Slide-${VERSION}.apk" | awk '{print $1}')"
          echo "apk_sha256=$digest" >> "$GITHUB_OUTPUT"
          (
            cd dist
            sha256sum "Slide-${VERSION}.apk" > "Slide-${VERSION}.apk.sha256"
          )
          cp input/release-notes.md \
            input/Slide-${VERSION}.cdx.json \
            input/Slide-${VERSION}-mapping.txt \
            input/Slide-${VERSION}-native-debug-symbols.zip \
            dist/

      - name: Attest signed APK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Slide-${{ needs.build.outputs.version }}.apk

      - name: Attest the signed APK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Slide-${{ needs.build.outputs.version }}.apk
          sbom-path: dist/Slide-${{ needs.build.outputs.version }}.cdx.json

      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified signed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.sha }}
          path: dist

      - name: Recheck artifact identity
        env:
          EXPECTED_SHA256: ${{ needs.sign.outputs.apk_sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          echo "$EXPECTED_SHA256  dist/Slide-${VERSION}.apk" | sha256sum --check --strict
          cd dist
          sha256sum --check --strict "Slide-${VERSION}.apk.sha256"

      - name: Refuse to mutate an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/release-lookup.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          case "$status" in
            404) ;;
            200)
              echo "Release $RELEASE_TAG already exists; releases are immutable." >&2
              exit 1
              ;;
            *)
              echo "Could not establish whether release $RELEASE_TAG exists (HTTP $status)." >&2
              exit 1
              ;;
          esac

      - name: Stage GitHub release and upload immutable assets
        id: staged_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/Slide-${{ needs.build.outputs.version }}.apk
            dist/Slide-${{ needs.build.outputs.version }}.apk.sha256
            dist/Slide-${{ needs.build.outputs.version }}.cdx.json
            dist/Slide-${{ needs.build.outputs.version }}-mapping.txt
            dist/Slide-${{ needs.build.outputs.version }}-native-debug-symbols.zip
          # Immutable releases reject asset uploads after publication. Keep stable and prerelease
          # releases draft until every asset is attached, then publish in the next fail-closed step.
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

      - name: Publish the fully populated draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_ID: ${{ steps.staged_release.outputs.id }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "The staged release did not return a numeric release ID." >&2
            exit 1
          }
          case "$PRERELEASE" in
            true|false) ;;
            *) echo "Invalid prerelease flag: $PRERELEASE" >&2; exit 1 ;;
          esac

          printf '{"draft":false,"prerelease":%s}\n' "$PRERELEASE" \
            > "$RUNNER_TEMP/publish-release.json"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/published-release.json" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$RUNNER_TEMP/publish-release.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$status" == 200 ]] || {
            echo "Could not publish staged release $RELEASE_ID (HTTP $status)." >&2
            exit 1
          }
          jq --exit-status \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .draft == false and .prerelease == $prerelease' \
            "$RUNNER_TEMP/published-release.json" >/dev/null || {
              echo "GitHub did not publish the staged release with the requested state." >&2
              exit 1
            }
